{% extends "base.html" %}
{% block title %}Manager Login{% endblock %}
{% block content %}
<div class="form-container login-container">
    <h1>🔒 Manager Portal</h1>
    <p class="subtitle">Restricted access.</p>

    <form action="{{ url_for('manager_login') }}" method="POST" class="feedback-form">
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter manager password (admin123)" required />
        </div>
        <button type="submit" class="btn btn-block">Login to Dashboard</button>
    </form>
</div>
{% endblock %}
