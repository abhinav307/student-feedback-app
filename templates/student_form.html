{% extends "base.html" %}
{% block title %}Submit Feedback{% endblock %}
{% block content %}
<div class="form-container">
    <h1>📝 Submit Your Feedback</h1>
    <p class="subtitle">Your feedback helps us improve.</p>

    <form action="{{ url_for('student') }}" method="POST" class="feedback-form">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="E.g. John Doe" required />
        </div>

        <div class="form-group">
            <label for="course">Course Enrolled</label>
            <input type="text" id="course" name="course" placeholder="E.g. Advanced Python 101" required />
        </div>

        <div class="form-group">
            <label for="feedback">Your Feedback</label>
            <textarea id="feedback" name="feedback" rows="5" placeholder="Share your experience..." required></textarea>
        </div>

        <button type="submit" class="btn btn-block">Submit Feedback</button>
    </form>
</div>
{% endblock %}
