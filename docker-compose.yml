version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=formify_super_secret_jwt_2026
      # Uncomment and set below for production MongoDB
      # - MONGODB_URI=mongodb+srv://<user>:<pass>@cluster0.mongodb.net/formify?retryWrites=true&w=majority
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
